<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лента постов — Лабораторная №7</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <h1 class="app-title">Лента постов</h1>

  <input
    type="search"
    id="search"
    class="search"
    placeholder="Поиск по заголовку"
    autocomplete="off"
  >

  <div id="posts" class="posts"></div>

  <p id="empty" class="status" hidden>Ничего не найдено</p>
  <p id="loading" class="status loading" hidden>Загрузка…</p>

  <div id="error" class="error" hidden>
    <p id="error-text" class="error-text"></p>
    <button type="button" id="retry-btn" class="btn-retry">Повторить</button>
  </div>

  <p id="end" class="status" hidden>Больше постов нет</p>

  <div id="sentinel" class="sentinel"></div>
</main>

<script src="script.js" defer></script>
</body>
</html>
