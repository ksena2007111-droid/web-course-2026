<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Быки и коровы — Лабораторная №4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <h1 class="app-title">Быки и коровы</h1>
  <p class="app-desc">Угадай число из 4 неповторяющихся цифр</p>

  <form id="guess-form" class="guess-form">
    <input
      type="text"
      id="guess-input"
      class="guess-input"
      placeholder="Например: 1234"
      maxlength="4"
      inputmode="numeric"
      autocomplete="off"
    >
    <button type="submit" class="btn btn-check">Проверить</button>
  </form>

  <p id="error-message" class="error-message" hidden></p>

  <div class="status-row">
    <span id="attempts-counter" class="attempts-counter">Попыток: 0</span>
    <button type="button" id="new-game-btn" class="btn btn-new-game">Новая игра</button>
  </div>

  <p id="win-message" class="win-message" hidden></p>

  <ul id="history-list" class="history-list"></ul>
</main>

<script src="script.js" defer></script>
</body>
</html>
